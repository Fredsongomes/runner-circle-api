services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: runnercircle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Troque DB_PORT no .env (ex.: 5433) se já tiver um Postgres usando a 5432
      - "${DB_PORT:-5432}:5432"
    volumes:
      - runnercircle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d runnercircle"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      # Dentro da rede do compose, o banco é acessado pelo nome do serviço, não por localhost
      DB_URL: jdbc:postgresql://postgres:5432/runnercircle
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Usa JWT_SECRET do .env/ambiente, se existir; senão, um valor SÓ para uso local
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao-0123456789abcdef}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Mantém as imagens enviadas mesmo quando o container da API é recriado
      - uploads:/app/uploads

volumes:
  runnercircle-db:
  uploads:
