name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # os testes usam H2 em memória: não precisam de banco nem de variáveis de ambiente
      - run: ./mvnw -B package
