# Perfil "dev" (padrao): banco local. URL e usuario tem defaults de maquina local; a senha vem so da variavel.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/runnercircle}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=WARN
logging.level.br.com.alura.runnercircleapi=INFO
