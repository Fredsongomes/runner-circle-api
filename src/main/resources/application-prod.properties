# Perfil "prod": tudo vem de variaveis de ambiente, sem valores padrao; se faltar alguma, a aplicacao nao sobe.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.br.com.alura.runnercircleapi=INFO

# Em producao o Hibernate so CONFERE se o schema bate com as entidades; nunca cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=validate
