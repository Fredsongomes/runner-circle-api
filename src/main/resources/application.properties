spring.application.name=runner-circle-api

# Perfil padrao para rodar localmente sem configurar nada; em producao use SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=update

springdoc.swagger-ui.path=/swagger-ui.html

# Actuator (vale para dev e prod): so o health fica exposto via HTTP, e sem detalhes internos
# (banco, disco...) na resposta, apenas {"status":"UP"} ou {"status":"DOWN"}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JSON estavel para Page: { "content": [...], "page": { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via-dto

app.upload.dir=${UPLOAD_DIR:uploads}

# acima dos 5 MB validados pelo ImagemStorageService, para que a validacao da aplicacao responda primeiro
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT: a chave vem SEMPRE da variavel de ambiente JWT_SECRET (minimo 32 bytes); sem ela a aplicacao nao sobe
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao=2h
app.jwt.expiracao-lembrar-me=30d
