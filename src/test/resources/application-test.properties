# Perfil "test": banco H2 em memória, criado ao subir o contexto e descartado ao final
spring.datasource.url=jdbc:h2:mem:runnercircle-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Chave fixa SÓ para testes (não é segredo real); em execução normal ela vem da variável JWT_SECRET
app.jwt.secret=chave-de-teste-somente-para-testes-automatizados-0123456789

app.upload.dir=target/test-uploads
